name: Deploy board to GitHub Pages

# Builds web/ and publishes it to the gh-pages branch. In the repository's
# Settings -> Pages, set Source to "Deploy from a branch", branch gh-pages.
on:
  push:
    branches: [master]
    paths: ["web/**", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test && npm run build
        working-directory: web
      - run: touch web/dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          force_orphan: true
          commit_message: Deploy board
